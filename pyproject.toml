[project]
name = "lparchive2epub"
version = "2.0.0"
description = ""
authors = [{ name = "Arwalk", email = "siragentprovocateurarwalk@gmail.com" }]
requires-python = ">=3.15,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "tqdm>=4.70,<5",
    "aiohttp>=3.14,<4",
    "aiohttp-client-cache[all]>=0.15",
    "ebooklib>=0.20",
    "pillow>=13,<14",
]

[project.optional-dependencies]
# --check: validate the written book with epubcheck (the package bundles the Java jar; Java is needed)
check = ["epubcheck>=5.3.0"]

[project.urls]
Repository = "https://github.com/Arwalk/lparchive2epub"

[project.scripts]
lparchive2epub = "lparchive2epub.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "coverage>=7.16,<8",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.1",
    "epubcheck>=5.3.0",
]

[tool.uv]
default-groups = "all"
# A uv-managed interpreter for everyone, never the system Python: python.org's Windows builds link OpenSSL 3.0,
# whose TLS handshake Cloudflare's bot challenge refuses whatever the headers (every Fandom picture lost in the
# 2026-10-19 archive-wide run); the managed builds link OpenSSL 3.5 and pass.
python-preference = "managed"

[tool.uv.build-backend]
module-name = ["lparchive2epub"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 130
target-version = "py315"

[tool.ruff.lint]
# Correctness only, no style churn: unused imports and names, syntax errors, obvious mistakes
select = ["F", "E7", "E9", "W6"]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
markers = [
  "archive: checks the extractor against every landing page of lparchive.org (tests/resources/landing_pages.zip); skip with -m 'not archive'",
  "live: builds a few Let's Plays from lparchive.org and compares them with tests/resources/live_checksums.json; skip with --offline",
]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"
