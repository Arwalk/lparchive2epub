[project]
name = "lparchive2epub"
version = "2.0.0"
description = ""
authors = [{ name = "Arwalk", email = "siragentprovocateurarwalk@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4>=4.12.2,<5",
    "tqdm>=4.66.4,<5",
    "aiohttp>=3.9.5,<4",
    "aiohttp-client-cache[all]>=0.14",
    "ebooklib>=0.20",
    "pillow==12.3.0",
]

[project.optional-dependencies]
# --check: validate the written book with epubcheck (the package bundles the Java jar; Java is needed)
check = ["epubcheck>=5.3.0"]

[project.urls]
Repository = "https://github.com/Arwalk/lparchive2epub"

[project.scripts]
lparchive2epub = "lparchive2epub.main:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "coverage>=7.4.0,<8",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.17.1",
    "epubcheck>=5.3.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["lparchive2epub"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# Correctness only, no style churn: unused imports and names, syntax errors, obvious mistakes
select = ["F", "E7", "E9", "W6"]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
markers = [
  "archive: checks the extractor against every landing page of lparchive.org (tests/resources/landing_pages.zip); skip with -m 'not archive'",
  "live: builds a few Let's Plays from lparchive.org and compares them with tests/resources/live_checksums.json; skip with --offline",
]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"
